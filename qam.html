<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.mkt a,.buy,.sell{display:block}
/* Layout: a single narrow ledger column; tabs on top, entries read like a trading journal */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --fg:#14211E; --muted:#5B6B67; --line:#D9E1DF;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --gain:#1E7F46; --loss:#B83C28; --warn-bg:#FBF3E4; --warn-fg:#7A5310; --on-sem:#FFFFFF;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#16211E; --fg:#E4ECEA; --muted:#93A5A0; --line:#26332F;
  --accent:#3FB8A5; --accent-ink:#06201B; --gain:#4CC27E; --loss:#EE7A63; --warn-bg:#2A2214; --warn-fg:#E9C27A; --on-sem:#08160F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211E; --fg:#E4ECEA; --muted:#93A5A0; --line:#26332F;
  --accent:#3FB8A5; --accent-ink:#06201B; --gain:#4CC27E; --loss:#EE7A63; --warn-bg:#2A2214; --warn-fg:#E9C27A; --on-sem:#08160F; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
html[lang="ar"] body{font-family:var(--font-ar)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.chip{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.admin{border-color:var(--accent);color:var(--accent)}
.hdr-right{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.lang{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-weight:600}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;font-weight:600;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:14px}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 14px;font-size:.85rem}
form.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
form h3{margin:0;font-size:.95rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-transform:none;letter-spacing:0;min-width:0}
textarea{min-height:80px;resize:vertical}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;justify-self:start}
.list{display:grid;gap:0;border-top:1px solid var(--line)}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:4px;min-width:0}
.item h4{margin:0;font-size:1rem}
.item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.del{background:none;border:0;color:var(--loss);font-size:.8rem;padding:0}
.empty{color:var(--muted);padding:22px 0;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:120px}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.up{color:var(--gain)} .down{color:var(--loss)}
.pill{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.copy{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:.75rem;padding:2px 8px}
ol.steps{margin:0;padding-inline-start:20px;display:grid;gap:10px}
ol.steps li{padding-inline-start:4px}
.guide h3{margin:8px 0 0;font-size:1rem}
.guide p{margin:0;color:var(--muted)}
.mkt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.coin{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;font-weight:500;background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.mkt .pair b{font-size:1rem}.mkt .pair span{color:var(--muted)}
.mkt .px{text-align:end;display:grid;gap:2px;justify-items:end}
.mkt .chg{font-family:var(--mono);font-size:.78rem;padding:1px 8px;border-radius:6px;color:var(--on-sem)}
.chg.up{background:var(--gain)}.chg.down{background:var(--loss)}
.acts{grid-column:2 / -1;display:flex;gap:8px}
.acts a{flex:1;text-align:center;text-decoration:none;font-weight:600;border-radius:8px;padding:8px 0;font-size:.9rem}
.buy{background:var(--gain);color:var(--on-sem)}.sell{background:var(--loss);color:var(--on-sem)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;overflow:visible;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom-nav button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border:0;border-radius:10px;font-size:.72rem;color:var(--muted)}
.bottom-nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav button[aria-selected="true"]{color:var(--accent);border-bottom:0}
.bottom-nav button[aria-selected="true"] svg{stroke-width:2.2}
#app{padding-bottom:84px}
h2.sec{margin:6px 0 0;font-size:1.05rem}
.acct{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.4rem}
.acct-actions{display:flex;gap:10px;flex-wrap:wrap}
.acct-actions .lang{flex:1;padding:10px}
.lang.danger{color:var(--loss);border-color:var(--loss)}
.bal{display:grid;gap:6px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--surface)));color:var(--accent-ink);border-radius:16px;padding:18px}
.bal .meta{color:inherit;opacity:.85}
.bal-num{display:flex;align-items:baseline;gap:8px}
.bal-num b{font-size:2.2rem;letter-spacing:-.01em}
.bal-num span{font-weight:600;opacity:.85}
.bal .copy{justify-self:start;color:inherit;border-color:currentColor}
.bal a{color:inherit;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>QAM</h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="hdr-right">
      <span class="chip" id="role" hidden></span>
      <button class="lang" id="langBtn" type="button"></button>
    </div>
  </header>

  <!-- Login / register -->
  <section id="auth" hidden>
    <nav role="tablist">
      <button role="tab" data-auth="login" data-t="login" aria-selected="true"></button>
      <button role="tab" data-auth="register" data-t="register"></button>
    </nav>
    <form class="panel" id="loginForm">
      <label><span data-t="fEmail"></span><input id="lEmail" type="email" required dir="ltr" autocomplete="email"></label>
      <label><span data-t="fPassword"></span><input id="lPw" type="password" required autocomplete="current-password"></label>
      <p class="notice" id="loginErr" hidden></p>
      <button class="primary" type="submit" data-t="login"></button>
    </form>
    <button class="lang" type="button" id="googleBtn" style="padding:11px" data-t="google"></button>
    <form class="panel" id="regForm" hidden>
      <label><span data-t="fName"></span><input id="rName" required maxlength="60" autocomplete="name"></label>
      <label><span data-t="fEmail"></span><input id="rEmail" type="email" required dir="ltr" autocomplete="email"></label>
      <label><span data-t="fPassword"></span><input id="rPw" type="password" required minlength="6" autocomplete="new-password"></label>
      <label><span data-t="fCode"></span><input id="rCode" maxlength="12" dir="ltr" autocapitalize="characters" placeholder="QAM-XXXXX"></label>
      <label><span data-t="fAff"></span><input id="rAff" type="url" maxlength="300" dir="ltr" placeholder="https://www.bybit.com/invite?ref=..."></label>
      <p class="notice" id="regErr" hidden></p>
      <button class="primary" type="submit" data-t="register"></button>
    </form>
  </section>

  <form class="panel" id="profileForm" hidden>
    <h3 data-t="finishH"></h3>
    <label><span data-t="fName"></span><input id="pfName" required maxlength="60"></label>
    <label><span data-t="fCode"></span><input id="pfCode" maxlength="12" dir="ltr" autocapitalize="characters" placeholder="QAM-XXXXX"></label>
    <label><span data-t="fAff"></span><input id="pfAff" type="url" maxlength="300" dir="ltr" placeholder="https://www.bybit.com/invite?ref=..."></label>
    <p class="notice" id="pfErr" hidden></p>
    <button class="primary" type="submit" data-t="register"></button>
  </form>

  <!-- App -->
  <div id="app" hidden style="display:grid;gap:18px">
    <nav role="tablist" id="tabs" class="bottom-nav">
      <button role="tab" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tabHome"></span></button>
      <button role="tab" data-tab="markets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M4 14l3 3 3-3M17 20V7M14 10l3-3 3 3"/></svg><span data-t="tabMarkets"></span></button>
      <button role="tab" data-tab="invite"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M18 8v6M15 11h6"/></svg><span data-t="tabInvite"></span></button>
      <button role="tab" data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/></svg><span data-t="tabAccount"></span></button>
    </nav>

    <section id="markets">
      <p class="notice" data-t="mktNote"></p>
      <div class="list" id="mktList"></div>
      <p class="meta" id="mktAsOf"></p>
    </section>

    <section id="news" hidden>
      <h2 class="sec" data-t="tabNews"></h2>
      <form class="panel admin-only" id="postForm" hidden>
        <h3 data-t="newPost"></h3>
        <label><span data-t="fTitle"></span><input id="pTitle" required maxlength="120"></label>
        <label><span data-t="fBody"></span><textarea id="pBody" required maxlength="3000"></textarea></label>
        <button class="primary" type="submit" data-t="publish"></button>
      </form>
      <div id="postList"></div>
    </section>

    <section id="results" hidden>
      <h2 class="sec" data-t="tabResults"></h2>
      <p class="notice" data-t="risk"></p>
      <div class="stats">
        <div class="stat"><b id="sTotal">—</b><span data-t="sTotal"></span></div>
        <div class="stat"><b id="sWin">—</b><span data-t="sWin"></span></div>
        <div class="stat"><b id="sLoss">—</b><span data-t="sLoss"></span></div>
      </div>
      <div class="chart" id="chart"></div>
      <form class="panel admin-only" id="resForm" hidden>
        <h3 data-t="newResult"></h3>
        <div class="row">
          <label><span data-t="fDate"></span><input type="date" id="rsDate" required></label>
          <label><span data-t="fPnl"></span><input type="number" id="rsPnl" step="0.01" required placeholder="-1.25 / 2.40"></label>
        </div>
        <label><span data-t="fNote"></span><input id="rsNote" maxlength="200"></label>
        <button class="primary" type="submit" data-t="save"></button>
      </form>
      <div id="resList"></div>
    </section>

    <section id="invite" hidden>
      <div class="panel" style="display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px">
        <span class="meta" data-t="yourCode"></span>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b class="num" id="myCode" style="font-size:1.6rem;letter-spacing:.06em" dir="ltr"></b><button class="copy" type="button" id="copyCode" data-t="copy"></button></div>
        <p style="margin:0;color:var(--muted)" data-t="shareHint"></p>
        <div class="meta" style="flex-wrap:wrap"><span dir="ltr" id="myLink" style="overflow-wrap:anywhere"></span><button class="copy" type="button" id="copyLink" data-t="copy"></button></div>
        <div id="inviterBox"></div>
        <label><span data-t="fAff"></span><input id="myAff" type="url" maxlength="300" dir="ltr" placeholder="https://www.bybit.com/invite?ref=..."></label>
        <button class="primary" type="button" id="saveAff" data-t="saveAff"></button>
      </div>
      <p class="notice" data-t="earnNote"></p>
      <h3 style="margin:6px 0 0;font-size:1rem" data-t="invited"></h3>
      <div id="invList"></div>
    </section>

    <section id="account" hidden>
      <div class="acct">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div style="min-width:0"><b id="acName" style="font-size:1.1rem"></b><div class="meta"><span dir="ltr" id="acCode"></span><span class="chip" id="acRole"></span></div></div>
      </div>
      <div class="acct-actions">
        <button class="lang" id="langBtn2" type="button"></button>
        <button class="lang danger" id="logoutBtn" type="button" data-t="logout"></button>
      </div>
    </section>

    <section id="members" hidden>
      <h2 class="sec" data-t="tabMembers"></h2>
      <p class="meta" id="memCount"></p>
      <div id="memList"></div>
    </section>

    <section id="guide" class="guide" hidden>
      <h2 class="sec" data-t="tabGuide"></h2>
      <p class="notice" data-t="guideNote"></p>
      <h3 data-t="gH1"></h3>
      <ol class="steps">
        <li data-t="g1"></li><li data-t="g2"></li><li data-t="g3"></li><li data-t="g4"></li><li data-t="g5"></li>
      </ol>
      <h3 data-t="gH2"></h3>
      <p data-t="gP2"></p>
    </section>
  </div>
</div>

let lang="ar";try{lang=localStorage.getItem("qam_lang")||"ar"}catch(e){}
let U=null,me=null,posts=[],results=[],members=[],codes=[],invitees=[],inviter=null,prices=null,tab="home",unsubs=[];
const GROUPS={home:["news","results"],markets:["markets"],invite:["invite"],account:["account","members","guide"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{try{return new Date(typeof d==="number"?d:d+(String(d).length===10?"T12:00:00":"")).toLocaleDateString(lang==="ar"?"ar-IQ":"en-GB",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
const fmtPct=n=>(n>0?"+":"")+Number(n).toFixed(2)+"%";
const fmtPrice=p=>p==null?"—":p>=1000?p.toLocaleString("en-US",{maximumFractionDigits:1}):p>=1?p.toLocaleString("en-US",{maximumFractionDigits:4}):p.toPrecision(4);
const safeUrl=u=>/^https:\/\/[^\s"<>]+$/.test(u||"")?u:"";
const isAdmin=()=>!!U&&String(U.email||"").toLowerCase()===ADMIN_EMAIL;
const errKey=e=>"err_"+String(e?.code||"net").replace(/[\/-]/g,"_");

function applyLang(){
  const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t];if(typeof v==="string")el.textContent=v});
  $("langBtn").textContent=$("langBtn2").textContent=lang==="ar"?"English":"العربية";
  if(me){$("role").textContent=isAdmin()?t.admin:t.member;$("role").classList.toggle("admin",isAdmin())}
  renderAll();
}
$("langBtn2").onclick=()=>$("langBtn").click();
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("qam_lang",lang)}catch(e){}applyLang()};
function showErr(el,e){const t=T[lang];el.textContent=t[typeof e==="string"?"err_"+e:errKey(e)]||t.err_net;el.hidden=false}

// ---------- screens ----------
function showScreen(which){
  $("auth").hidden=which!=="auth";$("profileForm").hidden=which!=="profile";$("app").hidden=which!=="app";$("role").hidden=which!=="app";
}
document.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-auth]").forEach(x=>x.setAttribute("aria-selected",x===b));$("loginForm").hidden=b.dataset.auth!=="login";$("regForm").hidden=b.dataset.auth!=="register"});
function showTab(name){
  if(!GROUPS[name])name="home";tab=name;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));
  const vis=GROUPS[name].filter(s=>s!=="members"||isAdmin());
  ["markets","news","results","invite","account","members","guide"].forEach(s=>$(s).hidden=!vis.includes(s));
  window.scrollTo(0,0);
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

// ---------- auth ----------
let pendingReg=null;
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginErr").hidden=true;try{await signInWithEmailAndPassword(auth,$("lEmail").value.trim(),$("lPw").value)}catch(x){showErr($("loginErr"),x)}};
$("regForm").onsubmit=async e=>{e.preventDefault();$("regErr").hidden=true;
  const name=$("rName").value.trim();let code=normCode($("rCode").value);
  if(!name)return showErr($("regErr"),"fields");
  pendingReg={name,code,aff:$("rAff").value.trim()};
  try{await createUserWithEmailAndPassword(auth,$("rEmail").value.trim(),$("rPw").value)}catch(x){pendingReg=null;showErr($("regErr"),x)}};
$("googleBtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){const el=$("loginForm").hidden?$("regErr"):$("loginErr");showErr(el,x)}};
$("logoutBtn").onclick=()=>signOut(auth);
$("profileForm").onsubmit=async e=>{e.preventDefault();$("pfErr").hidden=true;try{await createProfile({name:$("pfName").value.trim(),code:normCode($("pfCode").value),aff:$("pfAff").value.trim()})}catch(x){showErr($("pfErr"),x.message==="badCode"?"badCode":x)}};

function normCode(v){v=String(v||"").trim().toUpperCase();if(!v)return "";if(!v.startsWith("QAM-"))v="QAM-"+v.replace(/^QAM/,"");return v}
function randCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=crypto.getRandomValues(new Uint8Array(5));return "QAM-"+Array.from(b,x=>A[x%32]).join("")}

async function createProfile({name,code,aff}){
  if(!name)throw Object.assign(new Error("fields"),{code:"fields"});
  if(code){const c=await getDoc(doc(db,"qam_codes",code));if(!c.exists())throw new Error("badCode")}
  aff=safeUrl(aff);const at=Date.now();
  for(let i=0;i<5;i++){
    const mine=randCode();
    if((await getDoc(doc(db,"qam_codes",mine))).exists())continue;
    await setDoc(doc(db,"qam_codes",mine),{uid:U.uid,name,aff,invitedBy:code||"",at});
    await setDoc(doc(db,"qam_users",U.uid),{name,email:U.email||"",code:mine,invitedBy:code||"",at});
    await afterLogin();return;
  }
  throw new Error("net");
}

onAuthStateChanged(auth,async u=>{
  U=u;unsubs.forEach(f=>f());unsubs=[];me=null;posts=[];results=[];members=[];codes=[];invitees=[];inviter=null;
  if(!u){showScreen("auth");applyLang();return}
  if(pendingReg){const p=pendingReg;pendingReg=null;try{await createProfile(p);return}catch(x){showScreen("profile");$("pfName").value=p.name;$("pfCode").value=p.code;$("pfAff").value=p.aff;showErr($("pfErr"),x.message==="badCode"?"badCode":x);applyLang();return}}
  await afterLogin();
});

async function afterLogin(){
  let snap;try{snap=await getDoc(doc(db,"qam_users",U.uid))}catch(x){console.error(x)}
  if(!snap||!snap.exists()){showScreen("profile");$("pfName").value=U.displayName||"";const h=hashCode();if(h)$("pfCode").value=h;applyLang();return}
  me=snap.data();showScreen("app");
  document.querySelectorAll(".admin-only").forEach(el=>el.hidden=!isAdmin());
  const sub=(q,fn)=>unsubs.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));renderAll()},e=>console.error(e)));
  sub(query(collection(db,"qam_posts"),orderBy("at","desc"),limit(200)),d=>posts=d);
  sub(query(collection(db,"qam_results"),orderBy("date","desc"),limit(200)),d=>results=d);
  sub(query(collection(db,"qam_codes"),where("invitedBy","==",me.code)),d=>invitees=d);
  unsubs.push(onSnapshot(doc(db,"qam_codes",me.code),s=>{if(s.exists()){me.aff=s.data().aff||"";renderInvite()}}));
  if(me.invitedBy)unsubs.push(onSnapshot(doc(db,"qam_codes",me.invitedBy),s=>{inviter=s.exists()?s.data():null;renderInvite()}));
  if(isAdmin()){sub(collection(db,"qam_users"),d=>members=d);sub(collection(db,"qam_codes"),d=>codes=d)}
  applyLang();showTab(tab);
}

// ---------- actions ----------
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-del]");if(!b)return;
  if(!b.dataset.armed){b.dataset.armed="1";b.textContent=T[lang].confirm;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=T[lang].remove}},3000);return}
  try{
    if(b.dataset.del==="members"){const m=members.find(x=>x.id===b.dataset.id);if(m?.code)await deleteDoc(doc(db,"qam_codes",m.code));await deleteDoc(doc(db,"qam_users",b.dataset.id))}
    else await deleteDoc(doc(db,"qam_"+b.dataset.del,b.dataset.id));
  }catch(x){console.error(x)}
});
async function copyText(text,btn,sel){try{await navigator.clipboard.writeText(text);btn.textContent=T[lang].copied;setTimeout(()=>btn.textContent=T[lang].copy,2000)}catch(x){const r=document.createRange();r.selectNodeContents(sel);getSelection().removeAllRanges();getSelection().addRange(r)}}
$("copyCode").onclick=()=>copyText(me.code,$("copyCode"),$("myCode"));
$("copyLink").onclick=()=>copyText($("myLink").textContent,$("copyLink"),$("myLink"));
$("postForm").onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,"qam_posts"),{title:$("pTitle").value.trim().slice(0,120),body:$("pBody").value.trim().slice(0,3000),at:Date.now()});e.target.reset()}catch(x){console.error(x)}};
$("resForm").onsubmit=async e=>{e.preventDefault();const pnl=Math.round(parseFloat($("rsPnl").value)*100)/100;if(!isFinite(pnl))return;try{await addDoc(collection(db,"qam_results"),{date:$("rsDate").value,pnl,note:$("rsNote").value.trim().slice(0,200)});e.target.reset();$("rsDate").value=today()}catch(x){console.error(x)}};
$("saveAff").onclick=async()=>{try{await updateDoc(doc(db,"qam_codes",me.code),{aff:safeUrl($("myAff").value.trim())});$("saveAff").textContent=T[lang].saved;setTimeout(()=>$("saveAff").textContent=T[lang].saveAff,2000)}catch(x){console.error(x)}};

// ---------- rendering ----------
function delBtn(kind,id){return `<button class="del" type="button" data-del="${kind}" data-id="${esc(id)}">${T[lang].remove}</button>`}
function renderMarkets(){
  const t=T[lang],coins=prices?.coins||COINS.map(([sym,name])=>({sym,name,price:null,change:null}));
  $("mktList").innerHTML=coins.map(c=>{const u="https://www.bybit.com/en/trade/spot/"+c.sym+"/USDT";const ch=c.change;return `<div class="mkt"><span class="coin" aria-hidden="true">${esc(c.sym.slice(0,3))}</span><div class="pair"><b dir="ltr">${esc(c.sym)}</b> <span dir="ltr">/ USDT</span><br><span>${esc(c.name)}</span></div><div class="px"><span class="num" dir="ltr">${fmtPrice(c.price)}</span>${ch==null?"":`<span class="chg ${ch>=0?"up":"down"}" dir="ltr">${fmtPct(ch)}</span>`}</div><div class="acts"><a class="buy" href="${u}" target="_blank" rel="noopener">${t.buy}</a><a class="sell" href="${u}" target="_blank" rel="noopener">${t.sell}</a></div></div>`}).join("");
  $("mktAsOf").textContent=prices?.at?`${t.asOf}: ${new Date(prices.at).toLocaleTimeString(lang==="ar"?"ar-IQ":"en-GB",{hour:"2-digit",minute:"2-digit"})}`:t.noPrice;
}
function renderPosts(){
  const t=T[lang];
  $("postList").innerHTML=posts.length?`<div class="list">${posts.map(p=>`<article class="item"><h4>${esc(p.title)}</h4><p>${esc(p.body)}</p><div class="meta"><span>${fmtDate(p.at)}</span>${isAdmin()?delBtn("posts",p.id):""}</div></article>`).join("")}</div>`:`<p class="empty">${t.noPosts}</p>`;
}
function renderResults(){
  const t=T[lang],last=results.slice(0,30);
  if(!last.length){$("sTotal").textContent=$("sWin").textContent=$("sLoss").textContent="—";$("sTotal").className="";$("chart").innerHTML="";$("resList").innerHTML=`<p class="empty">${t.noResults}</p>`;return}
  const total=last.reduce((a,r)=>a+r.pnl,0);
  $("sTotal").textContent=fmtPct(total);$("sTotal").className=total>=0?"up":"down";
  $("sWin").textContent=last.filter(r=>r.pnl>0).length;$("sLoss").textContent=last.filter(r=>r.pnl<0).length;
  const data=[...last].reverse(),W=600,H=120,pad=8,max=Math.max(1,...data.map(r=>Math.abs(r.pnl))),zero=H/2,bw=(W-pad*2)/data.length;
  const bars=data.map((r,i)=>{const h=Math.abs(r.pnl)/max*(H/2-pad);const y=r.pnl>=0?zero-h:zero;return `<rect x="${(pad+i*bw+bw*.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" fill="var(${r.pnl>=0?"--gain":"--loss"})" rx="1.5"><title>${esc(r.date)} ${fmtPct(r.pnl)}</title></rect>`}).join("");
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${t.tabResults}"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>${bars}</svg>`;
  $("resList").innerHTML=`<div class="list">${results.map(r=>`<div class="item"><div class="res"><span class="meta">${fmtDate(r.date)}</span><span>${esc(r.note||"")}</span><span class="num ${r.pnl>=0?"up":"down"}" dir="ltr">${fmtPct(r.pnl)}</span></div>${isAdmin()?`<div class="meta">${delBtn("results",r.id)}</div>`:""}</div>`).join("")}</div>`;
}
function renderInvite(){
  if(!me)return;const t=T[lang];
  $("myCode").textContent=me.code;
  $("myLink").textContent=location.origin+location.pathname+"#"+me.code;
  if(document.activeElement!==$("myAff"))$("myAff").value=me.aff||"";
  const ia=inviter&&safeUrl(inviter.aff);
  $("inviterBox").innerHTML=inviter?`<div class="meta"><span>${t.inviterH}: <b>${esc(inviter.name)}</b></span>${ia?`<a href="${esc(ia)}" target="_blank" rel="noopener">${t.openAff}</a>`:""}</div>`:"";
  const inv=[...invitees].sort((a,b)=>b.at-a.at);
  $("invList").innerHTML=inv.length?`<div class="list">${inv.map(i=>`<div class="item"><h4>${esc(i.name)}</h4><div class="meta"><span>${fmtDate(i.at)}</span></div></div>`).join("")}</div>`:`<p class="empty">${t.noInv}</p>`;
}
function renderMembers(){
  if(!isAdmin())return;const t=T[lang];
  const byCode=Object.fromEntries(codes.map(c=>[c.id,c.name]));
  const list=[...members].sort((a,b)=>b.at-a.at);
  $("memCount").textContent=t.count(list.length);
  $("memList").innerHTML=`<div class="list">${list.map(m=>`<div class="item"><h4>${esc(m.name)} <span class="num meta" dir="ltr">${esc(m.code)}</span></h4><div class="meta"><span dir="ltr">${esc(m.email)}</span><span>${fmtDate(m.at)}</span>${m.invitedBy?`<span>${t.invitedBy}: ${esc(byCode[m.invitedBy]||m.invitedBy)}</span>`:""}<span>${t.invites}: ${codes.filter(c=>c.invitedBy===m.code).length}</span>${String(m.email||"").toLowerCase()===ADMIN_EMAIL?`<span class="pill">${t.admin}</span>`:delBtn("members",m.id)}</div></div>`).join("")}</div>`;
}
function renderAccount(){if(!me)return;const t=T[lang];$("acName").textContent=me.name;$("avatar").textContent=(me.name||"?").trim().charAt(0).toUpperCase();$("acCode").textContent=me.code;$("acRole").textContent=isAdmin()?t.admin:t.member;$("acRole").classList.toggle("admin",isAdmin())}
function renderAll(){renderAccount();renderMarkets();renderPosts();renderResults();renderInvite();renderMembers()}

// ---------- live prices (CoinGecko, every minute) ----------
const COINS=[["BTC","Bitcoin","bitcoin"],["ETH","Ethereum","ethereum"],["SOL","Solana","solana"],["XRP","XRP","ripple"],["HYPE","Hyperliquid","hyperliquid"],["ENA","Ethena","ethena"],["PEPE","Pepe","pepe"]];
async function loadPrices(){
  try{const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids="+COINS.map(c=>c[2]).join(",")+"&vs_currencies=usd&include_24hr_change=true");if(!r.ok)throw 0;const j=await r.json();
    prices={at:Date.now(),coins:COINS.map(([sym,name,cg])=>({sym,name,price:j[cg]?.usd??null,change:j[cg]?.usd_24h_change??null}))};renderMarkets()}catch(e){}
}

// invite link: page#QAM-XXXXX fills the code in
function hashCode(){try{const h=decodeURIComponent(location.hash.slice(1)).toUpperCase();return /^QAM-[A-Z0-9]{5}$/.test(h)?h:""}catch(e){return ""}}
if(hashCode()){$("rCode").value=hashCode();document.querySelector('[data-auth="register"]').click()}
$("rsDate").value=today();
applyLang();loadPrices();setInterval(()=>{if(!document.hidden)loadPrices()},60000);
</script>
